---
name: Lint

on:
  push:
    branches:
      - main
      - test
    paths-ignore: &paths-ignore
      - '**/README*'
      - '.github/workflows/check_types.yml'
      - '.github/workflows/build.yml'
  pull_request:
    paths-ignore: *paths-ignore

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Biome
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Biome
        uses: biomejs/setup-biome@v2 # Version comes from pnpm-lock.yaml

      - name: Lint
        run: biome ci

  lint_py:
    name: Ruff and ty
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Ruff
        run: uv run ruff check && uv run ruff format --check

      - name: ty
        run: uv run ty check
